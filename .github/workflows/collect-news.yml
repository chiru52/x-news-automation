name: Collect news (review drafts only)

on:
  schedule:
    # 06:17 UTC = 07:17 or 08:17 Stockholm, depending on daylight savings.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-draft-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore draft history
        uses: actions/cache/restore@v4
        with:
          path: .state/seen.json
          key: draft-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: draft-history-
      - name: Collect RSS and create review templates (never publish)
        run: python -m newsbot
        env:
          PUBLISH_ENABLED: 'false'
      - name: Save draft history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .state/seen.json
          key: draft-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
