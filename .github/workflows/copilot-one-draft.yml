name: Copilot - one news draft (manual, consumes AI credits)

on:
  workflow_dispatch:
    inputs:
      approve_credit_use:
        description: 'I approve one Copilot AI request using my included credits (may incur billable usage)'
        type: boolean
        required: true
        default: false
      article_index:
        description: 'Preferred candidate (1 through 9); if unavailable, try other shortlisted articles'
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'

# NEVER scheduled or triggered by a PR/push. Separate from daily RSS collection.
# Built-in GITHUB_TOKEN can only read repository data and make Copilot requests.
# It cannot push commits, create Issues, or publish to X.
permissions:
  contents: read
  issues: read  # Check private previously generated AI Drafts without writing them.
  copilot-requests: write  # GitHub Actions ephemeral token; no personal PAT needed.

concurrency:
  group: single-copilot-editorial-preview
  cancel-in-progress: false

jobs:
  one-draft:
    outputs:
      draft_ready: ${{ steps.editorial.outputs.ready }}
    # Default runs are skipped without consuming Copilot credits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_credit_use == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_DIR: output/copilot-preview
      STORY_INDEX: ${{ inputs.article_index }}
      PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fresh RSS candidates in preview ONLY
        shell: bash
        run: |
          python -m newsbot --preview --output "$PREVIEW_DIR"
      - name: Read private AI Draft history (no Copilot request)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Fail closed if private GitHub Issue history is unavailable.
          python -m newsbot.story_history \
            --repo "$GH_REPO" \
            --output "$RUNNER_TEMP/copilot-story-history.json"
      - name: Check unused, fresh shortlisted articles for publisher evidence (no AI call)

        id: source
        shell: bash
        run: |
          python -m newsbot.copilot_review research \
            --queue "$PREVIEW_DIR/review_queue.json" \
            --index "$STORY_INDEX" \
            --output "$RUNNER_TEMP/copilot-evidence.json" \
            --history "$RUNNER_TEMP/copilot-story-history.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          selected="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["selected_index"]))' "$RUNNER_TEMP/copilot-evidence.json")"
          echo "selected_index=$selected" >> "$GITHUB_OUTPUT"
          if python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["status"] == "extracted_unverified" else 1)' "$RUNNER_TEMP/copilot-evidence.json"; then
            echo 'usable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo '## No usable publisher article text — Copilot request skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'All eligible, unused articles were unavailable, or every shortlisted story was already reviewed or stale.' >> "$GITHUB_STEP_SUMMARY"
            echo 'No draft was generated; Copilot was skipped without model-credit use. Inspect the private review history and source diagnostics instead of retrying blindly.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare exactly one grounded candidate prompt
        if: ${{ steps.source.outputs.usable == 'true' }}
        shell: bash
        run: |
          python -m newsbot.copilot_review prepare \
            --queue "$PREVIEW_DIR/review_queue.json" \
            --index "${{ steps.source.outputs.selected_index }}" \
            --evidence "$RUNNER_TEMP/copilot-evidence.json" \
            --output "$RUNNER_TEMP/copilot-prompt.txt"
      - uses: actions/setup-node@v4
        if: ${{ steps.source.outputs.usable == 'true' }}
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        if: ${{ steps.source.outputs.usable == 'true' }}
        run: npm install -g @github/copilot
      - name: Make ONE Copilot request (30 AI credit soft session limit)
        if: ${{ steps.source.outputs.usable == 'true' }}
        shell: bash
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copilot-isolated"
          cd "$RUNNER_TEMP/copilot-isolated"
          # The untrusted RSS text is inside the prompt as DATA, never shell code.
          # Copilot cannot run shell, write files, access URLs or use built-in MCP.
          copilot -p "$(cat "$RUNNER_TEMP/copilot-prompt.txt")" \
            --no-ask-user --no-custom-instructions --no-auto-update \
            --disable-builtin-mcps \
            --excluded-tools='bash,edit,view,grep,glob,skill,web_fetch,web_search' \
            --deny-tool='shell,write,url,memory' \
            --max-ai-credits=30 \
            --silent > "$RUNNER_TEMP/copilot-response.txt"
          test -s "$RUNNER_TEMP/copilot-response.txt"
      - name: Show unverified candidate in GitHub Actions Summary
        id: editorial
        if: ${{ steps.source.outputs.usable == 'true' }}
        shell: bash
        run: |
          python -m newsbot.copilot_review finalize \
            --queue "$PREVIEW_DIR/review_queue.json" \
            --index "${{ steps.source.outputs.selected_index }}" \
            --model-output "$RUNNER_TEMP/copilot-response.txt" \
            --evidence "$RUNNER_TEMP/copilot-evidence.json" \
            --output "$RUNNER_TEMP/copilot-review.md"
          cat "$RUNNER_TEMP/copilot-review.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload editorial result only (no source tokens)
        if: ${{ steps.source.outputs.usable == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-editorial-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/copilot-review.md
          retention-days: 7
          if-no-files-found: warn

  # Separate least-privilege job: only private GitHub Issues, no Copilot
  # permission, no model call, no access to X credentials or publishing APIs.
  save-private-ai-draft:
    needs: one-draft
    if: ${{ needs.one-draft.outputs.draft_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: copilot-editorial-preview-${{ github.run_id }}
          path: ai-draft-review
      - name: Save editable draft in private GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python -m newsbot.ai_drafts \
            --repo "$GH_REPO" \
            --run-id "$ACTION_RUN_ID" \
            --draft ai-draft-review/copilot-review.md \
            --summary "$GITHUB_STEP_SUMMARY"
