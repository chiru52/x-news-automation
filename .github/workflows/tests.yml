name: Unit tests (no network or publishing)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SignalDesk client JavaScript syntax offline
        run: node --check dashboard/app.js
      - name: Test hosted Cloudflare Worker offline (no GitHub/Cloudflare calls)
        run: node --test tests/hosted-worker.test.mjs
