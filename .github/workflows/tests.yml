name: Unit tests (no network or publishing)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify responsive animated sign-in presentation without auth changes
        run: node --test tests/signaldesk-account-visual.test.mjs
      - name: Verify centered sidebar and mobile logo alignment
        run: node --test tests/signaldesk-sidebar-alignment.test.mjs
      - name: Validate SignalDesk client JavaScript syntax offline
        run: node --check dashboard/app.js
      - name: Test private cloud backup and restore offline
        run: |
          node --check dashboard/cloud-sync.mjs
          node --test tests/signaldesk-cloud-backup.test.mjs
      - name: Test offline browser workspace export and import
        run: |
          node --check dashboard/workspace-transfer.mjs
          node --test tests/signaldesk-workspace-transfer.test.mjs
      - name: Test browser refresh clock alignment offline
        run: node --test tests/signaldesk-refresh-clock.test.mjs
      - name: Test Global/India/Trending news sections offline
        run: node --test tests/signaldesk-news-sections.test.mjs
      - name: Test independent publisher coverage and conservative deduplication
        run: |
          node --check news-collector/intelligence.mjs
          node --test tests/signaldesk-news-intelligence.test.mjs
      - name: Test no-cost Post Studio and research tools offline
        run: node --test tests/signaldesk-studio.test.mjs
      - name: Test personal-topic perspective writing offline
        run: |
          node --check dashboard/perspective.mjs
          node --test tests/signaldesk-perspective.test.mjs
      - name: Test draft comparison and editorial review desk offline
        run: |
          node --check dashboard/review-desk.mjs
          node --test tests/signaldesk-review-desk.test.mjs
      - name: Test disabled Cloudflare AI gateway, signed Access JWT and daily D1 quota offline
        run: node --test tests/signaldesk-ai-gateway.test.mjs
      - name: Install pinned RSS XML parser for offline Worker tests
        run: npm install --prefix news-collector --no-audit --no-fund
      - name: Test bounded source recovery and feed coverage diagnostics offline
        run: |
          node --check news-collector/source-reliability.mjs
          node --test tests/signaldesk-source-reliability.test.mjs
      - name: Test shared Cloudflare Cron collector and read-only KV API offline
        run: |
          node --check news-collector/worker.mjs
          node --test tests/signaldesk-news-history.test.mjs
          node --test tests/signaldesk-news-collector.test.mjs
      - name: Test hosted Cloudflare Worker offline (no GitHub/Cloudflare calls)
        run: node --test tests/hosted-worker.test.mjs
