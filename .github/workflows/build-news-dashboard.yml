name: Build and publish public SignalDesk news dashboard (no X posting)

# User-authorized PUBLIC read-only dashboard. All private GitHub data is
# reduced to an explicit display allowlist before anonymous deployment.
# No X tokens, no auto-posting, no Copilot requests, no issue writes.
on:
  push:
    branches: [main]
    paths:
      - 'config/sources.json'
      - 'dashboard/**'
      - 'newsbot/dashboard_export.py'
      - 'newsbot/news_quality.py'
      - 'newsbot/trend_signals.py'
      - 'newsbot/__main__.py'
      - 'newsbot/core.py'
      - 'newsbot/writing.py'
      - 'newsbot/source_context.py'
      - '.github/workflows/build-news-dashboard.yml'
  workflow_dispatch:
  schedule:
    - cron: '12 7 * * *'

permissions:
  contents: read
  issues: read

concurrency:
  group: signaldesk-public-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public feed allowlist and no-posting safeguards
        run: |
          python -m unittest discover -s tests -p 'test_dashboard_export.py' -v
          python -m unittest discover -s tests -p 'test_writing.py' -v
          python -m unittest discover -s tests -p 'test_signaldesk_rss_context.py' -v
          node --check dashboard/app.js
          node --test tests/signaldesk-refresh-clock.test.mjs
          npm install --prefix news-collector --no-audit --no-fund
          node --test tests/signaldesk-news-history.test.mjs
          node --test tests/signaldesk-news-sections.test.mjs
          node --test tests/signaldesk-studio.test.mjs
      - name: Collect current RSS candidates (review and copy only)
        run: python -m newsbot --preview --dashboard-limit 30 --output output/dashboard-news
      - name: Export only public-approved news and AI draft text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m newsbot.dashboard_export \
            --queue output/dashboard-news/review_queue.json \
            --github \
            --output dist/signaldesk
      - name: Validate exact public schema, no secrets or private evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from newsbot.dashboard_export import validate_public_bundle
          data=json.loads(Path('dist/signaldesk/data.json').read_text(encoding='utf-8'))
          validate_public_bundle(data)
          count=len(data['news'])+len(data['drafts'])
          if count == 0: raise RuntimeError('Refusing to deploy an empty live feed')
          print(f'Public feed verified: {len(data["news"])} news, {len(data["drafts"])} drafts')
          print('No private evidence, GitHub secrets, X token or publishing operation')
          PY
      - name: Wire exact verified shared RSS feed (preserve static fallback)
        run: python -m news_collector.configure_live dist/signaldesk
      - name: Assert approved live feed URL and narrow CSP before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from news_collector.configure_live import APPROVED_ENDPOINT, APPROVED_ORIGIN
          root = Path('dist/signaldesk')
          cfg = json.loads((root / 'feed-config.json').read_text(encoding='utf-8'))
          headers = (root / '_headers').read_text(encoding='utf-8')
          if cfg != {'schema_version': 1, 'live_feed_url': APPROVED_ENDPOINT}:
              raise RuntimeError('Public collector configuration was not applied')
          if "connect-src 'self' " + APPROVED_ORIGIN + ";" not in headers:
              raise RuntimeError('Public collector CSP allowlist not applied')
          print('Exact approved shared collector URL and CSP verified; daily fallback retained')
          PY
      - name: Confirm Cloudflare Pages deployment credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$HAS_TOKEN" != "true" || "$HAS_ACCOUNT" != "true" ]]; then
            echo 'Cloudflare Pages credentials missing; public deployment skipped.'
            exit 1
          fi
      - name: Publish sanitized public files to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/signaldesk --project-name=signaldesk-news --branch=main
      - name: Publishing summary
        run: |
          echo '## SignalDesk public website deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare Pages: https://signaldesk-news.pages.dev' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public, read-only: news suggestions and prepared drafts only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No GitHub issues, private source evidence or credentials exported.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No X publishing or account connection.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save safe public site artifact for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: signaldesk-public-site-${{ github.run_id }}
          path: dist/signaldesk/
          if-no-files-found: error
          retention-days: 7
