name: Legacy SignalDesk starter artifact (no deployment)

# Retired: the public SignalDesk project already has a real news feed.
# A starter ZIP can be built manually for inspection, but this workflow
# NEVER deploys to Cloudflare or replaces the populated production site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-empty-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and package harmless empty starter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dashboard')
          data=json.loads((root/'data.json').read_text(encoding='utf-8'))
          assert data.get('schema_version') == 1
          assert data.get('news') == [] and data.get('drafts') == []
          out=Path('dist/public-starter')
          out.mkdir(parents=True, exist_ok=True)
          for name in ('index.html','styles.css','app.js','studio.mjs','refresh-clock.mjs','data.json','_headers'):
              (out/name).write_bytes((root/name).read_bytes())
          assert len(list(out.iterdir())) == 7
          print('Built EMPTY starter artifact only. Production site unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-empty-starter-do-not-deploy
          path: dist/public-starter/
          if-no-files-found: error
          retention-days: 7
      - name: Confirm deployment remains exclusively in public news workflow
        run: |
          echo 'Only an EMPTY starter ZIP was built; no Cloudflare deployment performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The public news site is owned by build-news-dashboard.yml.' >> "$GITHUB_STEP_SUMMARY"
